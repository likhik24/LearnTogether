name: learn-and-build

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: learnbuild
      POSTGRES_PASSWORD: learnbuild
      POSTGRES_DB: learnbuild
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnbuild -d learnbuild"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=Learnbuild_2024!"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      PORT: 3001
      NODE_ENV: development
      DATABASE_URL: postgres://learnbuild:learnbuild@postgres:5432/learnbuild
      REDIS_URL: redis://redis:6379
      OPENSEARCH_URL: http://opensearch:9200
      JWT_SECRET: dev-insecure-secret
      JWT_EXPIRES_IN: 1h
      ADMIN_EMAIL: admin@learnbuild.local
      ADMIN_PASSWORD: change-me-now
      ADMIN_NAME: Administrator
      OIDC_REDIRECT_BASE: http://localhost:3001
      OIDC_SUCCESS_REDIRECT: http://localhost:3100/admin
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AWS_COGNITO_ISSUER: ${AWS_COGNITO_ISSUER:-}
      AWS_COGNITO_CLIENT_ID: ${AWS_COGNITO_CLIENT_ID:-}
      AWS_COGNITO_CLIENT_SECRET: ${AWS_COGNITO_CLIENT_SECRET:-}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  teacher:
    build:
      context: .
      dockerfile: services/teacher/Dockerfile
    environment:
      PORT: 3002
      NODE_ENV: development
      DATABASE_URL: postgres://learnbuild:learnbuild@postgres:5432/learnbuild
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-insecure-secret
      AUTH_SERVICE_URL: http://auth:3001
      DOCUMENTS_BUCKET: learnbuild-documents
      AWS_REGION: us-east-1
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  search:
    build:
      context: .
      dockerfile: services/search/Dockerfile
    environment:
      PORT: 3003
      NODE_ENV: development
      OPENSEARCH_URL: http://opensearch:9200
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://learnbuild:learnbuild@postgres:5432/learnbuild
      JWT_SECRET: dev-insecure-secret
    ports:
      - "3003:3003"
    depends_on:
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  scheduling:
    build:
      context: .
      dockerfile: services/scheduling/Dockerfile
    environment:
      PORT: 3004
      NODE_ENV: development
      DATABASE_URL: postgres://learnbuild:learnbuild@postgres:5432/learnbuild
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-insecure-secret
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  voice:
    build:
      context: .
      dockerfile: services/voice/Dockerfile
    environment:
      PORT: 3005
      REDIS_URL: redis://redis:6379
      SEARCH_SERVICE_URL: http://search:3003
    ports:
      - "3005:3005"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  meetings:
    build:
      context: .
      dockerfile: services/meetings/Dockerfile
    environment:
      PORT: 3006
      DATABASE_URL: postgres://learnbuild:learnbuild@postgres:5432/learnbuild
      REDIS_URL: redis://redis:6379
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3006/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  payments:
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    environment:
      PORT: 3007
      DATABASE_URL: postgres://learnbuild:learnbuild@postgres:5432/learnbuild
      REDIS_URL: redis://redis:6379
    ports:
      - "3007:3007"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3007/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  opensearch_data:
  redis_data:
