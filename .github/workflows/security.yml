name: Security checks

on:
  pull_request:
    branches: [main, mainline]
  push:
    branches: [main, mainline]
  schedule:
    - cron: '31 2 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # GitHub Dependency Review requires the repository dependency graph, which
      # is not available on every plan/repository. Keep a blocking production
      # vulnerability gate that works independently of that repository setting.
      - run: pnpm audit --prod --audit-level high
