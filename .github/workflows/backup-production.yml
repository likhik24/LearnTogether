name: Backup production database

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    if: vars.PRODUCTION_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Create encrypted S3 backup through SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          REPO_PATH: ${{ vars.PRODUCTION_REPO_PATH }}
          BACKUP_BUCKET: ${{ vars.PRODUCTION_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_BUCKET"
          commands=$(jq -cn --arg path "$REPO_PATH" --arg bucket "$BACKUP_BUCKET" '[
            "set -euo pipefail",
            "cd " + ($path | @sh),
            "install -d -m 0700 /opt/learn-and-build-backups",
            "stamp=$(date -u +%Y%m%dT%H%M%SZ); file=/opt/learn-and-build-backups/learntogether-$stamp.dump; docker compose --env-file deploy/.env.production -f deploy/docker-compose.production.yml exec -T postgres sh -c '\''pg_dump -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -Fc'\'' >\"$file\"; test -s \"$file\"; aws s3 cp \"$file\" s3://" + $bucket + "/production/$stamp.dump --sse AES256; rm -f \"$file\""
          ]')
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Nightly LearnTogether PostgreSQL backup" --parameters "{\"commands\":$commands}" --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
