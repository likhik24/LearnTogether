name: learn-and-build-production

x-app-defaults: &app-defaults
  restart: unless-stopped
  networks:
    - app

x-database-environment: &database-environment
  NODE_ENV: production
  DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
  DATABASE_URL: postgres://learnbuild:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/learnbuild
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}

services:
  postgres:
    <<: *app-defaults
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: learnbuild
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: learnbuild
      # Keep data under a subdirectory so the bind-mounted root can hold other
      # files (e.g. lost+found) without upsetting Postgres' empty-dir check.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Bind-mount the database onto a known host path so all user profiles,
      # classes, bookings and every other row persist across container
      # recreation, redeploys, and `docker compose down -v`. Back this path up.
      - ${POSTGRES_DATA_DIR:-/opt/learn-and-build/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U learnbuild -d learnbuild]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:16-alpine
    restart: 'no'
    networks:
      - app
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: learnbuild
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATABASE: learnbuild
    volumes:
      - ./migrations:/migrations:ro
    command:
      - /bin/sh
      - -ec
      - |
        # The migration set builds the entire schema from empty and is fully
        # idempotent, so it runs unconditionally: it bootstraps a brand-new
        # database and is a safe no-op on an already-migrated one. Services
        # therefore run with DB_SYNCHRONIZE=false and rely on these migrations
        # as the single source of truth for the schema.
        for migration in /migrations/*.sql; do
          echo "Applying $$(basename "$$migration")"
          psql -v ON_ERROR_STOP=1 -f "$$migration"
        done
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    <<: *app-defaults
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    <<: *app-defaults
    image: opensearchproject/opensearch:2.18.0
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_SECURITY_PLUGIN: 'true'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: [CMD-SHELL, 'curl -sf http://localhost:9200/_cluster/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s

  scheduling:
    <<: *app-defaults
    build:
      context: ..
      dockerfile: services/scheduling/Dockerfile
    environment:
      <<: *database-environment
      PORT: 3004
      SEED_DEMO_CLASSES: ${SEED_DEMO_CLASSES:-false}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-https://www.learnandbuild.org}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  payments:
    <<: *app-defaults
    build:
      context: ..
      dockerfile: services/payments/Dockerfile
    environment:
      <<: *database-environment
      PORT: 3007
      PAYMENTS_PROVIDER: razorpay
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?Set RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?Set RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?Set RAZORPAY_WEBHOOK_SECRET}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?Set INTERNAL_SERVICE_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3007/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  auth:
    <<: *app-defaults
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    environment:
      <<: *database-environment
      PORT: 3001
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      APP_URL: ${PUBLIC_ORIGIN:-https://www.learnandbuild.org}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      SCHEDULING_API_URL: http://scheduling:3004
      PAYMENTS_API_URL: http://payments:3007
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?Set INTERNAL_SERVICE_SECRET}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-https://www.learnandbuild.org}
      OIDC_REDIRECT_BASE: ${PUBLIC_ORIGIN:-https://www.learnandbuild.org}/api/auth
      OIDC_SUCCESS_REDIRECT: ${OIDC_SUCCESS_REDIRECT:-https://www.learnandbuild.org/profile}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AWS_COGNITO_ISSUER: ${AWS_COGNITO_ISSUER:-}
      AWS_COGNITO_CLIENT_ID: ${AWS_COGNITO_CLIENT_ID:-}
      AWS_COGNITO_CLIENT_SECRET: ${AWS_COGNITO_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      scheduling:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  teacher:
    <<: *app-defaults
    build:
      context: ..
      dockerfile: services/teacher/Dockerfile
    environment:
      <<: *database-environment
      PORT: 3002
      AUTH_SERVICE_URL: http://auth:3001
      DOCUMENTS_BUCKET: ${DOCUMENTS_BUCKET:?Set DOCUMENTS_BUCKET}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      # The teacher service signs S3 presigned upload URLs, so it needs AWS
      # credentials. On EC2 leave these unset and grant an instance role
      # (the SDK reads it from IMDS). Off EC2 — a new machine, a non-AWS host —
      # set them in .env.production so presign works; without any credentials
      # presign returns HTTP 500 and portfolio/class-image uploads fail.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      UPLOAD_URL_TTL: ${UPLOAD_URL_TTL:-900}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-https://www.learnandbuild.org}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  search:
    <<: *app-defaults
    build:
      context: ..
      dockerfile: services/search/Dockerfile
    environment:
      <<: *database-environment
      PORT: 3003
      OPENSEARCH_URL: http://opensearch:9200
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-https://www.learnandbuild.org}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      scheduling:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  voice:
    <<: *app-defaults
    build:
      context: ..
      dockerfile: services/voice/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3005
      REDIS_URL: redis://redis:6379
      SEARCH_SERVICE_URL: http://search:3003
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-https://www.learnandbuild.org}
    depends_on:
      redis:
        condition: service_healthy
      search:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  web:
    <<: *app-defaults
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_AUTH_API_URL: /api/auth
        NEXT_PUBLIC_PROVIDER_API_URL: /api/provider
        NEXT_PUBLIC_SEARCH_API_URL: /api/search
        NEXT_PUBLIC_SCHEDULING_API_URL: /api/scheduling
        NEXT_PUBLIC_VOICE_API_URL: /api/voice
        NEXT_PUBLIC_PAYMENTS_API_URL: /api/payments
        AUTH_SERVICE_ORIGIN: http://auth:3001
        PROVIDER_SERVICE_ORIGIN: http://teacher:3002
        SEARCH_SERVICE_ORIGIN: http://search:3003
        SCHEDULING_SERVICE_ORIGIN: http://scheduling:3004
        VOICE_SERVICE_ORIGIN: http://voice:3005
        PAYMENTS_SERVICE_ORIGIN: http://payments:3007
    environment:
      NODE_ENV: production
      PORT: 3100
      AUTH_SERVICE_ORIGIN: http://auth:3001
      PROVIDER_SERVICE_ORIGIN: http://teacher:3002
      SEARCH_SERVICE_ORIGIN: http://search:3003
      SCHEDULING_SERVICE_ORIGIN: http://scheduling:3004
      VOICE_SERVICE_ORIGIN: http://voice:3005
      PAYMENTS_SERVICE_ORIGIN: http://payments:3007
    # Public ingress for the platform. The whole app is served from this single
    # origin (Next rewrites /api/* to the backend services on the private
    # network). By default it binds to loopback so a host reverse proxy (nginx,
    # Caddy, an ALB target, etc.) terminates TLS and forwards to it. Set
    # WEB_BIND=0.0.0.0 to expose it directly on the host (only behind a firewall
    # or when something else already provides TLS).
    ports:
      - '${WEB_BIND:-127.0.0.1}:3100:3100'
    depends_on:
      auth:
        condition: service_healthy
      teacher:
        condition: service_healthy
      scheduling:
        condition: service_healthy
      search:
        condition: service_healthy
      voice:
        condition: service_healthy
      payments:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3100').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

networks:
  app:
    driver: bridge

volumes:
  # Postgres now uses a host bind mount (see the postgres service) so the
  # source-of-truth data lives on a known, backup-friendly host path.
  # Redis (session/cache) and OpenSearch (search index) are derived state that
  # rebuilds from Postgres, so named volumes are sufficient for them.
  redis_data:
  opensearch_data:
